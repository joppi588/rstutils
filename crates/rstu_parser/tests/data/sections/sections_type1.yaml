class: Document
children:
  - class: Section
    attributes:
      section_marker: "="
      marker_len: 9
    children:
      - class: Title
        attributes:
          text: "Heading I\n"
      - class: BlankLine
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "Some Text\n"
      - class: BlankLine
      - class: Section
        attributes:
          section_marker: "-"
          marker_len: 10
        children:
          - class: Title
            attributes:
              text: "Heading II\n"
          - class: BlankLine
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "More Text\n"
          - class: BlankLine
  - class: Section
    attributes:
      section_marker: "="
      marker_len: 11
    children:
      - class: Title
        attributes:
          text: "Heading III\n"
      - class: BlankLine
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "Same level as Heading 1.\n"
