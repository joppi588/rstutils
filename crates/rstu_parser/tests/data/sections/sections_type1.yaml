class: Document
children:
  - class: Section
    attributes:
      marker_len: 9
      section_marker: "="
    children:
      - class: Title
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "Heading I\n"
      - class: BlankLine
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "Some Text\n"
      - class: BlankLine
      - class: Section
        attributes:
          marker_len: 10
          section_marker: "-"
        children:
          - class: Title
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Heading II\n"
          - class: BlankLine
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "More Text\n"
          - class: BlankLine
  - class: Section
    attributes:
      marker_len: 11
      section_marker: "="
    children:
      - class: Title
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "Heading III\n"
      - class: BlankLine
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "Same level as Heading 1.\n"
