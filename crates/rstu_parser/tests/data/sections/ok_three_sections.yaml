kind: Document
children:
  - kind: Section
    attributes:
      section_marker: =========
    children:
      - kind: Title
        text: "Heading 1\n"
      - kind: Paragraph
        children:
          - kind: PlainText
            attributes:
              text: "Some Text\n"
      - kind: Section
        attributes:
          section_marker: ---------
        children:
          - kind: Title
            text: "Heading 2\n"
          - kind: Paragraph
            children:
              - kind: PlainText
                attributes:
                  text: "More Text\n"
  - kind: Section
    attributes:
      section_marker: =========
    children:
      - kind: Title
        text: "Heading 3\n"
      - kind: Paragraph
        children:
          - kind: PlainText
            attributes:
              text: "Same level as Heading 1.\n"
