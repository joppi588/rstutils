class: Document
children:
  - class: Section
    attributes:
      section_marker:  "="
      marker_len: 9
      marker_len_opening: 1
    children:
      - class: Title
        text: "Heading 1"
      - class: Paragraph
        children:
          - class: PlainText
            text: "Some Text\n"
      - class: Section
        attributes:
          section_marker: "-"
          marker_len: 9
          marker_len_opening: 1
        children:
          - class: Title
            text: "Heading 2"
          - class: Paragraph
            children:
              - class: PlainText
                text: "More Text\n"
  - class: Section
    attributes:
      section_marker:  "="
      marker_len: 9
      marker_len_opening: 1
    children:
      - class: Title
        text: "Heading 3"
      - class: Paragraph
        children:
          - class: PlainText
            text: "Same level as Heading 1.\n"
