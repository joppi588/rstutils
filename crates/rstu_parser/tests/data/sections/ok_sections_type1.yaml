class: Document
children:
  - class: Section
    attributes:
      section_marker: "="
      marker_len: 9
      marker_len_opening: 0
    children:
      - class: Title
        text: "Heading I"
      - class: Paragraph
        children:
          - class: PlainText
            text: "Some Text\n"
      - class: Section
        attributes:
          section_marker: "-"
          marker_len: 10
          marker_len_opening: 0
        children:
          - class: Title
            text: "Heading II"
          - class: Paragraph
            children:
              - class: PlainText
                text: "More Text\n"
  - class: Section
    attributes:
      section_marker: "="
      marker_len: 11
      marker_len_opening: 0
    children:
      - class: Title
        text: "Heading III"
      - class: Paragraph
        children:
          - class: PlainText
            text: "Same level as Heading 1.\n"
