class: Document
children:
- class: Directive
  attributes:
    directive_arguments: Directives will not trigger custom parsing.
    directive_type: note
- class: Directive
  attributes:
    directive_type: nested
    indent: 2
  children:
  - class: BlankLine
  - class: Block
    children:
    - class: Section
      attributes:
        marker_len: 9
        section_marker: "*"
      children:
      - class: Title
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                nested1
      - class: Section
        attributes:
          marker_len: 9
          section_marker: '-'
        children:
        - class: Title
          children:
          - class: Paragraph
            children:
            - class: PlainText
              attributes:
                text: |
                  nested1.1
        - class: BlankLine
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                This paragraph belongs to the last nested section.
