class: Document
children:
- class: BlockQuote
  children:
  - class: BlankLine
  - class: Block
    attributes:
      indent: 2
    children:
    - class: Directive
      attributes:
        directive_type: nested
        indent: 2
      children:
      - class: BlankLine
      - class: Block
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: "docutils: A section in a block-quote is invalid.\nrstu_parser: A section in a block-quote is "
          - class: Emphasis
            attributes:
              text: valid
          - class: PlainText
            attributes:
              text: |
                .
        - class: BlankLine
        - class: Section
          attributes:
            marker_len: 15
            section_marker: '-'
          children:
          - class: Title
            children:
            - class: Paragraph
              children:
              - class: PlainText
                attributes:
                  text: |
                    invalid section
- class: BlankLine
- class: Directive
  attributes:
    directive_type: nested-current
    indent: 2
  children:
  - class: BlankLine
  - class: Block
    children:
    - class: Section
      attributes:
        marker_len: 12
        section_marker: "="
      children:
      - class: Title
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                valid, too
