class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: 'VMS/DOS-style options:'
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: /A
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option /A
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: /B
        - class: OptionArgument
          attributes:
            delimiter: ' '
          children:
          - class: PlainText
            attributes:
              text: file
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option /B
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: /CCC
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option /CCC
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: /DDD
        - class: OptionArgument
          attributes:
            delimiter: ' '
          children:
          - class: PlainText
            attributes:
              text: string
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option /DDD
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: /EEE
        - class: OptionArgument
          attributes:
            delimiter: '='
          children:
          - class: PlainText
            attributes:
              text: int
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option /EEE
