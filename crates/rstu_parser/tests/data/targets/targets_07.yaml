class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "External hyperlink:\n"
  - class: BlankLine
  - class: Target
    attributes:
      label: target
      raw: target
    children:
      - class: Spaces
        attributes:
          count: 1
      - class: Reference
        attributes:
          raw: http://www.python.org/
          refuri: http://www.python.org/
