class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Test unexpected section titles.\n"
- class: BlockQuote
  children:
  - class: BlankLine
  - class: Block
    attributes:
      indent: 4
    children:
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: "Title\n=====\nParagraph.\n"
    - class: BlankLine
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: "-----\nTitle\n-----\nParagraph.\n"
