class: Document
children:
- class: Section
  attributes:
    marker_len: 36
    section_marker: "="
  children:
  - class: Title
    children:
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: "Title containing "
      - class: InlineMarkup
        attributes:
          markup: emphasis
          text: inline
      - class: PlainText
        attributes:
          text: " "
      - class: InlineMarkup
        attributes:
          markup: inline_literal
          text: markup
      - class: PlainText
        attributes:
          text: "\n"
  - class: BlankLine
  - class: Paragraph
    children:
    - class: PlainText
      attributes:
        text: "Paragraph.\n"
