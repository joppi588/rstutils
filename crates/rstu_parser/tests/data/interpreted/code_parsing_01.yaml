class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Custom role based on code role:\n"
- class: BlankLine
- class: Directive
  attributes:
    directive_arguments: python(code)
    directive_type: role
    indent: 3
    raw_content: ":class: testclass\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Python code "
  - class: InterpretedText
    attributes:
      pos: prefix
      role: python
      text: print("The end")
  - class: PlainText
    attributes:
      text: ".\n"
