class: Document
children:
- class: Directive
  attributes:
    directive_arguments: tex(code)
    directive_type: role
    indent: 3
    raw_content: ":language: latex\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Custom role based on code role:\n"
  - class: InterpretedText
    attributes:
      pos: prefix
      role: tex
      text: $\alpha = f(x)$
  - class: PlainText
    attributes:
      text: ".\n"
