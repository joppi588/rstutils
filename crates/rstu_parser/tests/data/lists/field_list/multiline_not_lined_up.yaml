class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "One-paragraph, multi-liners, not lined up:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Authors
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Me,\nMyself,\nand I\n"
      - class: FieldListItem
        attributes:
          fieldname: Version
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "1\nor so\n"
      - class: FieldListItem
        attributes:
          fieldname: Date
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "2001-08-11\n(Saturday)\n"
      - class: FieldListItem
        attributes:
          fieldname: "Parameter i"
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "counter\n(integer)\n"
      - class: BlankLine
