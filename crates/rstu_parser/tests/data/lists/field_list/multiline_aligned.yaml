class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "One-paragraph, multi-liners:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Authors
        children:
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Me,\n"
                  - class: PlainText
                    attributes:
                      text: "Myself,\nand I\n"
      - class: FieldListItem
        attributes:
          fieldname: Version
        children:
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "1\n"
                  - class: PlainText
                    attributes:
                      text: "or so\n"
      - class: FieldListItem
        attributes:
          fieldname: Date
        children:
          - class: Block
            attributes:
              indent: 7
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "2001-08-11\n"
                  - class: PlainText
                    attributes:
                      text: "(Saturday)\n"
      - class: FieldListItem
        attributes:
          fieldname: "Parameter i"
        children:
          - class: Block
            attributes:
              indent: 14
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "counter\n"
                  - class: PlainText
                    attributes:
                      text: "(integer)\n"
