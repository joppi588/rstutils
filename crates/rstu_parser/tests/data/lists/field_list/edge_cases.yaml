class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Some edge cases:\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ": Field: marker must not begin with whitespace.\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ":Field : marker must not end with whitespace.\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Field: marker is missing its open-colon.\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ":Field marker is missing its close-colon.\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: 'Field\: names\: with\: colons\:'
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "are possible.\n"
      - class: FieldListItem
        attributes:
          fieldname: \\Field\  names with backslashes\\
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "are possible, too.\n"
      - class: FieldListItem
        attributes:
          fieldname: \\
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "A backslash.\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ':Not a\\\: field list.

            '
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ':Not a \: field list either.

            '
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ':\: Not a field list either.

            '
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ':\:

            '
  - class: Block
    attributes:
      indentation: "  "
    children:
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "A definition list, not a field list.\n"
