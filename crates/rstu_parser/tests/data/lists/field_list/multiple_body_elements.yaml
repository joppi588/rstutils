class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        text: "Multiple body elements:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Authors
        children:
          - class: BulletList
            children:
              - class: BulletListItem
                attributes:
                  marker: "-"
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        text: "Me\n"
              - class: BulletListItem
                attributes:
                  marker: "-"
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        text: "Myself\n"
              - class: BulletListItem
                attributes:
                  marker: "-"
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        text: "I\n"
          - class: BlankLine
      - class: FieldListItem
        attributes:
          fieldname: Abstract
        children:
          - class: IndentedBlockHanging
            attributes:
              indent: 4
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    text: "This is a field list item's body,

                      containing multiple elements.\n"
              - class: Paragraph
                children:
                  - class: PlainText
                    text: "Here's a literal block::\n"
              - class: Paragraph
                children:
                  - class: PlainText
                    text: "def f(x):\n    return x**2 + x\n"
              - class: Paragraph
                children:
                  - class: PlainText
                    text: "Even nested field lists are possible:\n"
              - class: FieldList
                children:
                  - class: FieldListItem
                    attributes:
                      fieldname: Date
                    children:
                      - class: Paragraph
                        children:
                          - class: PlainText
                            text: "2001-08-11\n"
                  - class: FieldListItem
                    attributes:
                      fieldname: Day
                    children:
                      - class: Paragraph
                        children:
                          - class: PlainText
                            text: "Saturday\n"
                  - class: FieldListItem
                    attributes:
                      fieldname: Time
                    children:
                      - class: Paragraph
                        children:
                          - class: PlainText
                            text: "15:07\n"
