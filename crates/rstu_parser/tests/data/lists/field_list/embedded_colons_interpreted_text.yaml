class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Edge cases involving embedded colons and interpreted text.\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Recognized as field list items:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: field\:`name`
        children:
          - class: Block
            attributes:
              indent: 16
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text:
                        "interpreted text (standard role) requires\n                     \
                        \           escaping a leading colon in a field name\n"
          - class: BlankLine
      - class: FieldListItem
        attributes:
          fieldname: field:name
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "unambiguous, no need for escapes\n"
          - class: BlankLine
      - class: FieldListItem
        attributes:
          fieldname: field::name
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "double colons are OK, too\n"
          - class: BlankLine
      - class: FieldListItem
        attributes:
          fieldname: field:\`name`
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "not interpreted text\n"
          - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "`field name`:code:: interpreted text with role in the field name\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "                     works only when the role follows the text\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ':a `complex`:code:\  field name: field body

            '
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Not recognized as field list items:\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "::code:`not a field name`: paragraph with interpreted text\n"
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: ":code:`not a field name`: paragraph with interpreted text\n"
