class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "One-liners, no blank lines:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Author
        children:
          - class: Block
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "Me\n"
      - class: FieldListItem
        attributes:
          fieldname: Version
        children:
          - class: Block
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "1\n"
      - class: FieldListItem
        attributes:
          fieldname: Date
        children:
          - class: Block
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "2001-08-11\n"
      - class: FieldListItem
        attributes:
          fieldname: Parameter i
        children:
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "integer\n"
      - class: BlankLine
