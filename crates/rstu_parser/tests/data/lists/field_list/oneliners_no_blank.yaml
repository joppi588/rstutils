class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        text: "One-liners, no blank lines:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Author
        children:
          - class: Paragraph
            children:
              - class: PlainText
                text: "Me\n"
      - class: FieldListItem
        attributes:
          fieldname: Version
        children:
          - class: Paragraph
            children:
              - class: PlainText
                text: "1\n"
      - class: FieldListItem
        attributes:
          fieldname: Date
        children:
          - class: Paragraph
            children:
              - class: PlainText
                text: "2001-08-11\n"
      - class: FieldListItem
        attributes:
          fieldname: Parameter i
        children:
          - class: Paragraph
            children:
              - class: PlainText
                text: "integer\n"
      - class: BlankLine
