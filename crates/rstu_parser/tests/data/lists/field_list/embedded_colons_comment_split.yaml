class: Document
children:
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: first
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "field\n"
      - class: FieldListItem
        attributes:
          fieldname: field:name:with:embedded:colons
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "unambiguous, no need for escapes\n"
          - class: BlankLine
  - class: Comment
    attributes:
      text: "\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: embedded:colons
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "in first field name\n"
      - class: FieldListItem
        attributes:
          fieldname: field:\`:name
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "not interpreted text\n"
      - class: FieldListItem
        attributes:
          fieldname: field:\`name
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "not interpreted text\n"
