class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "This is a field list:\n"
  - class: BlankLine
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: field_1
        children:
        - class: Spaces
          attributes:
            count: 1
        - class: Block
          children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "Some Text\n"
      - class: FieldListItem
        attributes:
          fieldname: field_2
        children:
          - class: Spaces
            attributes:
              count: 2
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "More Text\n"
      - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "A field list with hanging indent:\n"
  - class: BlankLine
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: long_field_name
        children:
          - class: Spaces
            attributes:
              count: 1
          - class: Block
            attributes:
              indent: 4
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Text here\nreads better if\nwrapped around.\n"
      - class: FieldListItem
        attributes:
          fieldname: field_2
        children:
          - class: Spaces
            attributes:
              count: 1
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "more Text\n"
      - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "In field lists\n"
  - class: BlankLine
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: field_1
        children:
          - class: Spaces
            attributes:
              count: 1
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Blank lines\n"
      - class: BlankLine
      - class: FieldListItem
        attributes:
          fieldname: field_2
        children:
          - class: Spaces
            attributes:
              count: 1
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "will not start a new list\n"
