class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Field bodies starting on the next line:\n"
  - class: FieldList
    children:
      - class: FieldListItem
        attributes:
          fieldname: Author
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "\nMe\n"
      - class: FieldListItem
        attributes:
          fieldname: Version
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "\n1\n"
      - class: FieldListItem
        attributes:
          fieldname: Date
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "\n2001-08-11\n"
      - class: FieldListItem
        attributes:
          fieldname: Parameter i
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "\ninteger\n"
      - class: BlankLine
