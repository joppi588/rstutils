class: Document
children:
- class: Directive
  attributes:
    directive_type: some-directive
    indent: 4
  children:
  - class: FieldList
    children:
    - class: FieldListItem
      attributes:
        fieldname: field1
      children:
      - class: Block
        attributes:
          indent: 9
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                value1
    - class: FieldListItem
      attributes:
        fieldname: field-2
      children:
      - class: Block
        attributes:
          indent: 10
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                value-2
    - class: FieldListItem
      attributes:
        fieldname: +field+3
      children:
      - class: Block
        attributes:
          indent: 11
        children:
        - class: Paragraph
          children:
          - class: PlainText
            attributes:
              text: |
                value+3
