class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        text: "This is a bullet list without blanklines:\n"
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
        - class: Paragraph
          children:
            - class: PlainText
              text: "First item\n"
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
        - class: Paragraph
          children:
            - class: PlainText
              text: "Second item\n"
        - class: Blankline
