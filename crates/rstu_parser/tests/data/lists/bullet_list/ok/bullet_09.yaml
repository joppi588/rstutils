class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Unicode bullets:\n"
  - class: BlankLine
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: •
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "BULLET\n"
              - class: BlockQuote
                children:
                  - class: BlankLine
                  - class: Block
                    attributes:
                      indent: 2
                    children:
                      - class: BulletList
                        children:
                          - class: BulletListItem
                            attributes:
                              marker: ‣
                            children:
                              - class: Block
                                attributes:
                                  indent: 2
                                children:
                                  - class: Paragraph
                                    children:
                                      - class: PlainText
                                        attributes:
                                          text: "TRIANGULAR BULLET\n"
                                  - class: BlockQuote
                                    children:
                                      - class: BlankLine
                                      - class: Block
                                        attributes:
                                          indent: 2
                                        children:
                                          - class: BulletList
                                            children:
                                              - class: BulletListItem
                                                attributes:
                                                  marker: ⁃
                                                children:
                                                  - class: Block
                                                    attributes:
                                                      indent: 2
                                                    children:
                                                      - class: Paragraph
                                                        children:
                                                          - class: PlainText
                                                            attributes:
                                                              text: "HYPHEN BULLET\n"
