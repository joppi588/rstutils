class: Document
children:
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
        - class: Block
          attributes:
            indent: 1
          children:
          - class: Paragraph
            children:
            - class: PlainText
              attributes:
                text: "\n"
      - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "empty item above\n"
