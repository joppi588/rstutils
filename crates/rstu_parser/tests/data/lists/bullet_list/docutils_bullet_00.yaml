class: Document
children:
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
          - class: Spaces
            attributes:
              count: 1
          - class: Block
            attributes:
              indent: 2
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "item\n"
