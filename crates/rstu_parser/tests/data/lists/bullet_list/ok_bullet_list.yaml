class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "This is a bullet list:\n"
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
          - class: Block
            attributes:
              indent: 2
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "First item\n"
              - class: BlankLine
              - class: Paragraph
                children:
                - class: PlainText
                  attributes:
                    text: "Indented paragraph 1.\n"
              - class: BlankLine
              - class: Paragraph
                children:
                - class: PlainText
                  attributes:
                    text: "Indented paragraph 2.\n"
              - class: BlankLine
      - class: BulletListItem
        attributes:
          marker: "-"
        children:
          - class: Block
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: "Second item\n"
      - class: BlankLine
