class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "No blank line between:\n"
  - class: BulletList
    children:
      - class: BulletListItem
        attributes:
          marker: "+"
        children:
          - class: Block
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "item 1\n"
      - class: BulletListItem
        attributes:
          marker: "+"
        children:
          - class: Block
            children:
            - class: Paragraph
              children:
                - class: PlainText
                  attributes:
                    text: "item 2\n"
      - class: BlankLine
