class: Document
children:
  - class: DefinitionList
    children:
      - class: DefinitionListItem
        children:
          - class: Term
            children:
              - class: PlainText
                attributes:
                  text: "term"
          - class: Definition
            children:
              - class: Block
                attributes:
                  indent: 2
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        attributes:
                          text: "definition\n"
      - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "paragraph\n"
