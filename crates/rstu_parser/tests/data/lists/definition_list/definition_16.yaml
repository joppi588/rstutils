class: Document
children:
- class: BulletList
  children:
  - class: BulletListItem
    attributes:
      marker: "*"
    children:
    - class: Block
      attributes:
        indent: 2
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: "A bullet list\n"
  - class: BulletListItem
    attributes:
      marker: "*"
    children:
    - class: Block
      attributes:
        indent: 2
      children:
      - class: DefinitionList
        children:
        - class: DefinitionListItem
          children:
          - class: Term
            children:
            - class: PlainText
              attributes:
                text: This becomes a definition list
          - class: Definition
            children:
            - class: Block
              attributes:
                indent: 3
              children:
              - class: Paragraph
                children:
                - class: PlainText
                  attributes:
                    text: "because the indent is too large\n"
  - class: BulletListItem
    attributes:
      marker: "*"
    children:
    - class: Block
      attributes:
        indent: 2
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: "it should be reformatted.\n"
