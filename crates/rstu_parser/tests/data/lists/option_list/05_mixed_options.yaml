class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: |
        Mixed short, long, and VMS/DOS options:
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          option_string: -a
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option -a
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: file
          delimiter: "="
          option_string: --bbbb
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option -bbbb
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          option_string: /C
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option /C
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: name
          delimiter: ' '
          option_string: --dddd
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option --dddd
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: string
          delimiter: ' '
          option_string: -e
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option -e
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: file
          delimiter: ' '
          option_string: /F
    - class: Block
      attributes:
        indent: 13
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option /F
