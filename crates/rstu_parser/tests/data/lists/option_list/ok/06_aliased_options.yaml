class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: |
        Aliased options:
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          option_string: -a
      - class: Option
        attributes:
          option_string: --aaaa
      - class: Option
        attributes:
          option_string: /A
    - class: Block
      attributes:
        indent: 31
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option -a, --aaaa, /A
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: file
          delimiter: ' '
          option_string: -b
      - class: Option
        attributes:
          arg: file
          delimiter: "="
          option_string: --bbbb
      - class: Option
        attributes:
          arg: file
          delimiter: ' '
          option_string: /B
    - class: Block
      attributes:
        indent: 31
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              option -b, --bbbb, /B
