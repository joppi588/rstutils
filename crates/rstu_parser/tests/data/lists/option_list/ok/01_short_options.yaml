class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: 'Short options:'
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: -a
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option -a
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: -b
        - class: OptionArgument
          attributes:
            delimiter: ' '
          children:
          - class: PlainText
            attributes:
              text: file
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option -b
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        children:
        - class: OptionString
          children:
          - class: PlainText
            attributes:
              text: -c
        - class: OptionArgument
          attributes:
            delimiter: ' '
          children:
          - class: PlainText
            attributes:
              text: name
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: option -c
