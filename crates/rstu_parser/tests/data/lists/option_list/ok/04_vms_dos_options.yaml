class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: |
            VMS/DOS-style options:
  - class: BlankLine
  - class: OptionList
    children:
      - class: OptionListItem
        children:
          - class: OptionGroup
            children:
              - class: Option
                attributes:
                  option_string: /A
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: |
                        option /A
      - class: OptionListItem
        children:
          - class: OptionGroup
            children:
              - class: Option
                attributes:
                  arg: file
                  delimiter: " "
                  option_string: /B
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: |
                        option /B
      - class: OptionListItem
        children:
          - class: OptionGroup
            children:
              - class: Option
                attributes:
                  option_string: /CCC
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: |
                        option /CCC
      - class: OptionListItem
        children:
          - class: OptionGroup
            children:
              - class: Option
                attributes:
                  arg: string
                  delimiter: " "
                  option_string: /DDD
          - class: Block
            attributes:
              indent: 13
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: |
                        option /DDD
      - class: OptionListItem
        children:
          - class: OptionGroup
            children:
              - class: Option
                attributes:
                  arg: int
                  delimiter: "="
                  option_string: /EEE
          - class: Block
            attributes:
              indent: 10
            children:
              - class: Paragraph
                children:
                  - class: PlainText
                    attributes:
                      text: |
                        option /EEE
