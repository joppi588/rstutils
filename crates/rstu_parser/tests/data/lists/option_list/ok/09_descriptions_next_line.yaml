class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: |
        Descriptions begin on next line:
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          flag: -a
    - class: Block
      attributes:
        indent: 4
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |2

              option -a, line 1
              line 2
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: file
          delimiter: ' '
          flag: -b
    - class: Block
      attributes:
        indent: 4
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |2

              option -b, line 1
              line 2
