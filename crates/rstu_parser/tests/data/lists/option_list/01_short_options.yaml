class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Short options:\n"
- class: BlankLine
- class: OptionList
  children:
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          option_string: -a
    - class: Block
      attributes:
        indent: 9
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: "option -a\n"
  - class: BlankLine
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: "file"
          option_string: -b
          delimiter: " "
    - class: Block
      attributes:
        indent: 9
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: "option -b\n"
  - class: BlankLine
  - class: OptionListItem
    children:
    - class: OptionGroup
      children:
      - class: Option
        attributes:
          arg: "name"
          option_string: -c
          delimiter: " "
    - class: Block
      attributes:
        indent: 9
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: "option -c\n"
