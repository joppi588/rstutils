          children:
          - class: PlainText
            attributes:
              text: <'a[, b[, ...]]]'>
    - class: Description
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: Comma separated arguments.
  - class: OptionListItem
    children:
