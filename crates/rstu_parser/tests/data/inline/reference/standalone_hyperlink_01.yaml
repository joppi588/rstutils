      text: |
        Valid URLs with escaped markup characters:
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      refuri: http://example.com/*content*/whatever
      refuri_raw: http://example.com/\*content\*/whatever
  - class: PlainText
    attributes:
      text: |+

