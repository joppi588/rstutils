class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Duplicate refnames in references with embedded alias.\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Explicit targets: "
  - class: Reference
    attributes:
      type: inline_internal_target
      label: tg1
  - class: PlainText
    attributes:
      text: " and "
  - class: Reference
    attributes:
      type: inline_internal_target
      label: tg2
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "References with embedded alias: "
  - class: Reference
    attributes:
      label: link
      type: href
      raw: link <tg1_>
      refname: tg1
  - class: PlainText
    attributes:
      text: " and "
  - class: Reference
    attributes:
      label: link
      type: href
      raw: link <tg2_>
      refname: tg2
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "No clash with anonymous reference "
  - class: Reference
    attributes:
      label: link
      type: ahref
      raw: link <tg1_>
      refname: tg1
  - class: PlainText
    attributes:
      text: ".\n"
