class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Adjacent footnote refs are not possible: "
  - class: Reference
    attributes:
      label: "*"
      type: footnote
  - class: PlainText
    attributes:
      text: "[#label]_ "
  - class: Reference
    attributes:
      label: '#'
      type: footnote
  - class: PlainText
    attributes:
      text: "[2]_ "
  - class: Reference
    attributes:
      label: "1"
      type: footnote
  - class: PlainText
    attributes:
      text: "[*]_\n"
