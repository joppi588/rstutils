class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Duplicate refnames in references with embedded alias.\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Explicit targets: "
  - class: Target
    attributes:
      label: tg1
      markup: inline
  - class: PlainText
    attributes:
      text: " and "
  - class: Target
    attributes:
      label: tg2
      markup: inline
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "References with embedded alias: "
  - class: Reference
    attributes:
      label: link
      markup: inline
      raw: link <tg1_>
      refname: tg1
      type: href
  - class: PlainText
    attributes:
      text: " and "
  - class: Reference
    attributes:
      label: link
      markup: inline
      raw: link <tg2_>
      refname: tg2
      type: href
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "No clash with anonymous reference "
  - class: Reference
    attributes:
      label: link
      markup: inline
      raw: link <tg1_>
      refname: tg1
      type: ahref
  - class: PlainText
    attributes:
      text: ".\n"
