class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Relative URIs' reference text can be omitted:\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      markup: inline
      raw: <reference>
      refuri: reference
      type: href
  - class: PlainText
    attributes:
      text: "\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      markup: inline
      raw: <anonymous>
      refuri: anonymous
      type: ahref
  - class: PlainText
    attributes:
      text: "\n"
