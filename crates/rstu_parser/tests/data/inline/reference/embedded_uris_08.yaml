class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Relative URIs' reference text can be omitted:\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      label: reference
      type: href
      raw: <reference>
      refuri: reference
  - class: PlainText
    attributes:
      text: "\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      label: anonymous
      type: ahref
      raw: <anonymous>
      refuri: anonymous
  - class: PlainText
    attributes:
      text: "\n"
