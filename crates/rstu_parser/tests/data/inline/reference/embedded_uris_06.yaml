class: Document
children:
- class: Paragraph
  children:
  - class: Reference
    attributes:
      refname: embedded email address
      markup: inline
      raw: embedded email address <jdoe@example.com>
      refuri: jdoe@example.com
      type: ahref
  - class: PlainText
    attributes:
      text: "\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: Reference
    attributes:
      refname: embedded email address broken across lines
      markup: inline
