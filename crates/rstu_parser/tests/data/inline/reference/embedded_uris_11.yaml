class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Report duplicate reftext:.\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Explicit targets: "
  - class: Target
    attributes:
      label: file.txt
      markup: inline
  - class: PlainText
    attributes:
      text: ", "
  - class: Target
    attributes:
      label: file.html
      markup: inline
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Embedded URI: named "
  - class: Reference
    attributes:
      markup: inline
      raw: <file.txt>
      refuri: file.txt
      type: href
  - class: PlainText
    attributes:
      text: " and anonymous "
  - class: Reference
    attributes:
      markup: inline
      raw: <file.html>
      refuri: file.html
      type: ahref
  - class: PlainText
    attributes:
      text: ".\n"
