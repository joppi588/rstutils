class: Document
children:
  - class: Section
    attributes:
      section_marker: "-"
      marker_len: 31
      marker_len_opening: 0
    children:
      - class: Title
        text: "Short text with strong elements"
      - class: Paragraph
        children:
          - class: InlineMarkup
            text: print this in bold text.
            attributes:
              markup: strong
      - class: Paragraph
        children:
          - class: PlainText
            text: "print "
          - class: InlineMarkup
            text: this
            attributes:
              markup: strong
          - class: PlainText
            text: " too.\n"
      - class: Paragraph
        children:
          - class: PlainText
            text: "This "
          - class: InlineMarkup
            text: should
            attributes:
              markup: strong
          - class: PlainText
            text: " "
          - class: InlineMarkup
            text: work as
            attributes:
              markup: strong
          - class: PlainText
            text: " well.\n"
