kind: Document
children:
  - kind: Section
    attributes:
      section_marker: -------------------------------
    children:
      - kind: Title
        text: "Short text with strong elements"
      - kind: Paragraph
        children:
          - kind: Strong
            attributes:
              text: print this in bold text.
      - kind: Paragraph
        children:
          - kind: PlainText
            attributes:
              text: "print "
          - kind: Strong
            attributes:
              text: this
          - kind: PlainText
            attributes:
              text: " too.\n"
      - kind: Paragraph
        children:
          - kind: PlainText
            attributes:
              text: "This "
          - kind: Strong
            attributes:
              text: should
          - kind: PlainText
            attributes:
              text: " "
          - kind: Strong
            attributes:
              text: work as
          - kind: PlainText
            attributes:
              text: " well.\n"
