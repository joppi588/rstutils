class: Document
children:
  - class: Section
    attributes:
      marker_len: 31
      marker_len_opening: 0
      section_marker: "-"
    children:
      - class: Title
        attributes:
          text: "Short text with strong elements"
      - class: Paragraph
        children:
          - class: InlineMarkup
            attributes:
              text: print this in bold text.
              markup: strong
          - class: PlainText
            attributes:
              text: "\n"
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "print "
          - class: InlineMarkup
            attributes:
              text: this
              markup: strong
          - class: PlainText
            attributes:
              text: " too.\n"
      - class: Paragraph
        children:
          - class: PlainText
            attributes:
              text: "This "
          - class: InlineMarkup
            attributes:
              text: should
              markup: strong
          - class: PlainText
            attributes:
              text: " "
          - class: InlineMarkup
            attributes:
              text: work as
              markup: strong
          - class: PlainText
            attributes:
              text: " well.\n"
