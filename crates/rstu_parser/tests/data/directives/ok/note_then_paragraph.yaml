class: Document
children:
  - class: Directive
    attributes:
      directive_type: note
    children:
      - class: Block
        attributes:
          indent: 3
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "This is inside the note.\n"
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "This paragraph follows the note.\n"
