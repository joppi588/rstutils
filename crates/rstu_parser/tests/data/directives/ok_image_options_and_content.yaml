class: Document
children:
  - class: Directive
    attributes:
      directive_arguments: " https://example.com/sample.png"
      directive_type: image
    children:
      - class: FieldList
        children:
          - class: FieldListItem
            attributes:
              fieldname: height
            children:
              - class: Block
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        text: "20mm\n"
                  - class: BlankLine
      - class: Paragraph
        children:
          - class: PlainText
            text: "This image has a caption.\n"
