class: Document
children:
  - class: Directive
    attributes:
      directive_arguments: "https://example.com/sample.png"
      directive_type: image
      indent: 3
    children:
      - class: FieldList
        children:
          - class: FieldListItem
            attributes:
              fieldname: height
            children:
              - class: Block
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        attributes:
                          text: "20mm\n"
          - class: BlankLine
      - class: Block
        children:
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "This image has a caption.\n"
