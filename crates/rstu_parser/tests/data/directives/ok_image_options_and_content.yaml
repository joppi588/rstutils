class: Document
children:
  - class: Directive
    attributes:
      directive_arguments: "https://example.com/sample.png"
      directive_type: image
    children:
      - class: Block
        attributes:
          indent: 3
        children:
          - class: FieldList
            children:
              - class: FieldListItem
                attributes:
                  fieldname: height
                children:
                  - class: Block
                    attributes:
                      indent: 9
                    children:
                      - class: Paragraph
                        children:
                          - class: PlainText
                            attributes:
                              text: "20mm\n"
              - class: BlankLine
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "This image has a caption.\n"
