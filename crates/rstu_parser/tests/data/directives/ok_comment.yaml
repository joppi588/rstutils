class: Document
children:
  - class: Comment
    attributes:
      text: "This is a simple comment.\nIt should be ignored by the parser as visible content.\n\n"
  - class: Comment
    attributes:
      text: "This is a comment\n"
  - class: Comment
    attributes:
      text: "_so: is this!\n"
  - class: Comment
    attributes:
      text: "[and] this!\n"
  - class: Comment
    attributes:
      text: "this:: too!\n"
  - class: Comment
    attributes:
      text: "|even| this:: !\n\n\n"
  - class: Comment
    attributes:
      text: "This comment\nspans\nmultiple lines\n\n"
