class: Document
children:
  - class: Comment
    attributes:
      indent: 3
      text: "This is a simple comment.\nIt should be ignored by the parser as visible content.\n\n"
  - class: Comment
    attributes:
      text: "This is a comment\n"
  - class: Comment
    attributes:
      indent: 3
      text: "_so: is this!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "[and] this!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "this:: too!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "|even| this:: !\n\n\n"
  - class: Comment
    attributes:
      indent: 3
      text: "This comment\nspans\n\n  multiple\nlines\n\n"
  - class: Paragraph
    children:
    - class: PlainText
      attributes:
        text: "Normal text\n"
