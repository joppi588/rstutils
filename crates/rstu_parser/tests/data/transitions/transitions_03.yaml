class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: |
        Test unexpected transition markers.
- class: BlockQuote
  children:
  - class: BlankLine
  - class: Block
    attributes:
      indent: 4
    children:
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: |
            Block quote.
    - class: BlankLine
    - class: Transition
      attributes:
        marker_len: 8
        marker_type: '-'
    - class: BlankLine
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: |
            Paragraph.
