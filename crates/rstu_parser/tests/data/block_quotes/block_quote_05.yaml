class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: |
        Paragraph.
- class: BlockQuote
  children:
  - class: BlankLine
  - class: Block
    attributes:
      indent: 3
    children:
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: |
            Block quote.
    - class: BlankLine
    - class: Attribution
      attributes:
        marker: '-- '
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              Attribution
- class: BlankLine
- class: Paragraph
