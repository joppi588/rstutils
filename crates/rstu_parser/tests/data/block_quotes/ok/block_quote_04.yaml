class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Here is a paragraph.\n"
  - class: BlockQuote
    children:
      - class: BlankLine
      - class: Block
        attributes:
          indent: 4
        children:
          - class: Comment
          - class: BlockQuote
            children:
              - class: BlankLine
              - class: Block
                attributes:
                  indent: 4
                children:
                  - class: Paragraph
                    children:
                      - class: PlainText
                        attributes:
                          text: "Indent 8 spaces.\n"
          - class: BlankLine
          - class: Paragraph
            children:
              - class: PlainText
                attributes:
                  text: "Indent 4 spaces.\n"
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "This will generate a nested block quote, with the first paragraph\nnested deeper than the second.\n"
