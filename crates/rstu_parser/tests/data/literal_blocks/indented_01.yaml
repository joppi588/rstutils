class: Document
children:
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "A paragraph:\n"
  - class: LiteralBlock
    attributes:
      indent: 4
      text: "A literal block.\n"
      type: FullyMinimized
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Another paragraph:\n"
  - class: LiteralBlock
    attributes:
      indent: 4
      text: "Another literal block.\nWith two blank lines following.\n\n"
      type: FullyMinimized
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "A final paragraph.\n"
