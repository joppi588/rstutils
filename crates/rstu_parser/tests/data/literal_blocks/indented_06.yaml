class: Document
children:
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "\\\\:\n"
  - class: LiteralBlock
    attributes:
      indent: 4
      text: "A literal block.\n"
      type: FullyMinimized
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "\\::\nNot a literal block.\n"
