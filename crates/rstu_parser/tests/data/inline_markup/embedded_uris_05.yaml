class: Document
children:
- class: BlankLine
- class: Paragraph
  children:
  - class: InlineMarkup
    attributes:
      label: embedded URI with escaped whitespace
      markup: ahref
      raw: "embedded URI with escaped whitespace <http://example.com/a\\ \nlong/path\\ and/some\\ escaped\\ whitespace>"
      refuri: http://example.com/a long/path and/some escaped whitespace
  - class: PlainText
    attributes:
      text: "\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: InlineMarkup
    attributes:
      label: omitted reference text with escaped whitespace
      markup: ahref
      raw: <omitted\ reference\ text\ with\ escaped\ whitespace>
      refuri: omitted reference text with escaped whitespace
  - class: PlainText
    attributes:
      text: "\n"
