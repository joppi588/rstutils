class: Document
children:
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Duplicate refnames in references with embedded alias.\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "Explicit targets: "
  - class: InlineMarkup
    attributes:
      markup: inline_internal_target
      text: tg1
  - class: PlainText
    attributes:
      text: " and "
  - class: InlineMarkup
    attributes:
      markup: inline_internal_target
      text: tg2
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "References with embedded alias: "
  - class: InlineMarkup
    attributes:
      label: link
      markup: href
      raw: link <tg1_>
      refname: tg1
  - class: PlainText
    attributes:
      text: " and "
  - class: InlineMarkup
    attributes:
      label: link
      markup: href
      raw: link <tg2_>
      refname: tg2
  - class: PlainText
    attributes:
      text: ".\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: PlainText
    attributes:
      text: "No clash with anonymous reference "
  - class: InlineMarkup
    attributes:
      label: link
      markup: ahref
      raw: link <tg1_>
      refname: tg1
  - class: PlainText
    attributes:
      text: ".\n"
