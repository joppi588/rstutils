class: Document
children:
- class: BlankLine
- class: Paragraph
  children:
  - class: InlineMarkup
    attributes:
      label: no embedded alias (whitespace inside bracket)
      markup: ahref
      raw: no embedded alias (whitespace inside bracket) < alias_ >
      refuri: alias_
  - class: PlainText
    attributes:
      text: "\n"
- class: BlankLine
- class: Paragraph
  children:
  - class: InlineMarkup
    attributes:
      label: no embedded alias (no preceding whitespace)
      markup: ahref
      raw: no embedded alias (no preceding whitespace)<alias_>
      refname: alias
  - class: PlainText
    attributes:
      text: "\n"
