class: Document
children:
  - class: Comment
    attributes:
      indent: 3
      text: "This is a simple comment.\nIt should be ignored by the parser as visible content.\n"
  - class: BlankLine
  - class: Comment
    attributes:
      text: "This is a comment\n"
  - class: Comment
    attributes:
      indent: 3
      text: "\n_so: is this!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "\n[and] this!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "\nthis:: too!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "\n|even| this:: !\n"
  - class: BlankLine
    attributes:
      count: 2
  - class: Comment
    attributes:
      indent: 3
      text: "This comment\nspans\n\n  multiple\nlines\n"
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Normal text\n"
