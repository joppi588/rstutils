class: Document
children:
  - class: Comment
    attributes:
      indent: 3
      text: |
        This is a simple comment.
        It should be ignored by the parser as visible content.
  - class: BlankLine
  - class: Comment
    attributes:
      text: "This is a comment\n"
  - class: Comment
    attributes:
      indent: 3
      text: |

        _so: is this!
  - class: Comment
    attributes:
      indent: 3
      text: |

        [and] this!
  - class: Comment
    attributes:
      indent: 3
      text: "\nthis:: too!\n"
  - class: Comment
    attributes:
      indent: 3
      text: "\n|even| this:: !\n"
  - class: BlankLine
    attributes:
      count: 2
  - class: Comment
    attributes:
      indent: 3
      text: |
        This comment
        spans

          multiple
        lines
  - class: BlankLine
  - class: Paragraph
    children:
      - class: PlainText
        attributes:
          text: "Normal text\n"
