class: Document
children:
- class: BulletList
  children:
  - class: BulletListItem
    attributes:
      marker: +
    children:
    - class: Block
      attributes:
        indent: 2
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              bullet paragraph 1
      - class: BlankLine
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              bullet paragraph 2
      - class: BlankLine
      - class: Comment
        attributes:
          text: |+
            comment between bullet paragraphs 2 and 3

      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              bullet paragraph 3
