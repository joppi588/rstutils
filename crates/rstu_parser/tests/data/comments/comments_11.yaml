class: Document
children:
- class: Comment
  attributes:
    indent: 3
    text: |
      Next is an empty comment, which serves to end this comment and
      prevents the following block quote being swallowed up.
- class: BlankLine
- class: Comment
- class: BlockQuote
  children:
  - class: BlankLine
  - class: Block
    attributes:
      indent: 4
    children:
    - class: Paragraph
      children:
      - class: PlainText
        attributes:
          text: |
            A block quote.
- class: BlankLine
- class: Comment
  attributes:
    indent: 3
    text: |+
      As it would happen
      in

      this

      case
