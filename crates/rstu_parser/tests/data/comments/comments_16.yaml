class: Document
children:
- class: BulletList
  children:
  - class: BulletListItem
    attributes:
      marker: +
    children:
    - class: Block
      attributes:
        indent: 2
      children:
      - class: Paragraph
        children:
        - class: PlainText
          attributes:
            text: |
              bullet
      - class: BlankLine
      - class: Comment
        attributes:
          text: |
            trailing comment
