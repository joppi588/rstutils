[package]
name = "rstu_parser"
version.workspace = true
description = "Internal component crate for rstu."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log = "0.4"
regex = "1"
rstu_ast.workspace = true

[dev-dependencies]
rstest = "0.24"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize", "serialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
